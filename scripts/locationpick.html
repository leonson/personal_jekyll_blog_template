<!DOCTYPE html>
<html>
<head>
    <title>Coordinate Picker</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
    <style>
        #map { 
            height: 500px; 
            width: 100%;
        }
        #coordinates {
            margin: 10px 0;
            padding: 10px;
            background-color: #f0f0f0;
            border-radius: 4px;
            font-family: monospace;
            white-space: pre;
        }
        .copied {
            background-color: #4CAF50 !important;
            color: white !important;
        }
        #inputForm {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            padding: 5px;
            margin-right: 10px;
            width: 200px;
        }
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button {
            padding: 5px 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #history {
            margin-top: 10px;
            padding: 10px;
            background-color: #f8f8f8;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="inputForm">
        <input type="text" id="searchInput" placeholder="Search location">
        <button onclick="searchLocation()">Search</button>
    </div>
    <div class="controls">
        <button onclick="resetCounter()">Reset Counter</button>
        <button onclick="copyAllLocations()">Copy All Locations</button>
        <span>Current ID: <span id="currentId">1</span></span>
    </div>
    <div id="map"></div>
    <div id="coordinates">Click anywhere on the map to get coordinates</div>
    <div id="history">History will appear here</div>

    <script>
        let locationCounter = 1;
        let locationHistory = [];
        let searchMarker = null;

        function resetCounter() {
            locationCounter = 1;
            document.getElementById('currentId').textContent = locationCounter;
        }

        function updateHistory(yamlText) {
            locationHistory.push(yamlText);
            const historyDiv = document.getElementById('history');
            historyDiv.textContent = locationHistory.join('\n');
        }

        function copyAllLocations() {
            const allText = locationHistory.join('\n');
            navigator.clipboard.writeText(allText).then(() => {
                alert('All locations copied to clipboard!');
            });
        }

        function normalizeLongitude(lng) {
            while (lng > 180) lng -= 360;
            while (lng < -180) lng += 360;
            return lng;
        }

        async function searchLocation() {
            const searchQuery = document.getElementById('searchInput').value;
            if (!searchQuery) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const location = data[0];
                    const lat = parseFloat(location.lat);
                    const lng = parseFloat(location.lon);
                    
                    // Remove previous search marker if exists
                    if (searchMarker) {
                        map.removeLayer(searchMarker);
                    }

                    // Add new marker
                    searchMarker = L.marker([lat, lng])
                        .addTo(map)
                        .bindPopup('Search result: ' + location.display_name)
                        .openPopup();

                    // Center map on location
                    map.setView([lat, lng], 13);
                } else {
                    alert('Location not found');
                }
            } catch (error) {
                console.error('Search error:', error);
                alert('Error searching for location');
            }
        }

        // Allow search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchLocation();
            }
        });

        // Initialize map centered on approximate area of interest (Xiamen area)
        const map = L.map('map').setView([37.77, -122.4], 10);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add click handler
        map.on('click', function(e) {
            const title = `Location ${locationCounter}`;
            const lat = e.latlng.lat.toFixed(6);
            const lng = normalizeLongitude(e.latlng.lng).toFixed(6);
            
            // Create YAML format
            const yamlFormat = `location_${locationCounter}:
  lat: ${lat}
  lng: ${lng}
  title: "${title}"`;
            
            // Update coordinates display
            const coordsDiv = document.getElementById('coordinates');
            coordsDiv.textContent = yamlFormat;
            
            // Create a temporary marker
            const marker = L.marker(e.latlng)
                .addTo(map)
                .bindPopup(`ID: ${locationCounter}<br>Title: ${title}`);
            
            // Remove the marker after 3 seconds
            setTimeout(() => {
                map.removeLayer(marker);
            }, 3000);

            // Copy to clipboard
            navigator.clipboard.writeText(yamlFormat).then(() => {
                coordsDiv.classList.add('copied');
                coordsDiv.textContent = `${yamlFormat}\n\n(Copied to clipboard!)`;
                setTimeout(() => {
                    coordsDiv.classList.remove('copied');
                }, 1000);
            });

            // Update history
            updateHistory(yamlFormat);

            // Increment counter
            locationCounter++;
            document.getElementById('currentId').textContent = locationCounter;
            
            // Remove search marker if exists
            if (searchMarker) {
                map.removeLayer(searchMarker);
                searchMarker = null;
            }
        });
    </script>
</body>
</html>
